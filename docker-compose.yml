name: ${COMPOSE_PROJECT_NAME:-estuary-lab}
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-estuary-lab}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estuary}
      POSTGRES_USER: ${POSTGRES_USER:-estuary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estuary_demo_change_me}
    ports: ["${DB_PORT:-17702}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 4s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-estuary-lab}-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-estuary-lab}-backend
    environment: &backend-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-estuary}:${POSTGRES_PASSWORD:-estuary_demo_change_me}@db:5432/${POSTGRES_DB:-estuary}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-estuary_local_demo_secret_change_before_deploy_2026}
      SEED_DEMO: ${SEED_DEMO:-true}
      TASK_MODE: redis
      ARTIFACT_DIR: /artifacts
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    ports: ["${BACKEND_PORT:-19202}:8000"]
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 6s
      timeout: 4s
      retries: 25
      start_period: 60s
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-estuary-lab}-worker
    command: ["python", "-m", "src.worker"]
    environment:
      <<: *backend-env
      SEED_DEMO: "false"
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/tmp/worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime<180"]
      interval: 10s
      timeout: 4s
      retries: 20
      start_period: 30s
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-estuary-lab}-frontend
    ports: ["${FRONTEND_PORT:-18202}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 6s
      timeout: 4s
      retries: 20
volumes:
  db-data:
  redis-data:
  artifacts:
